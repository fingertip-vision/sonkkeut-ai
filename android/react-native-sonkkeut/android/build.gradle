// react-native-sonkkeut 안드로이드 라이브러리
// 앱(sonkkeut-frontend)의 autolinking이 이 파일을 모듈로 포함한다.

buildscript {
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "1.9.24"
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "kr.sonkkeut"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  // 모델 파일은 압축하지 않아야 빠르게 읽힌다
  aaptOptions {
    noCompress "onnx", "task"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-vision-camera")
  // Frame.getImageProxy()의 회전 정보(ImageProxy)를 쓰기 위해. VisionCamera와 같은 버전
  compileOnly "androidx.camera:camera-core:${safeExtGet("cameraxVersion", "1.5.0-alpha03")}"
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
  implementation "com.google.mediapipe:tasks-vision:0.10.14"
  implementation "org.opencv:opencv:4.10.0"
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
}

// MediaPipe 손 관절 모델(약 7.8MB)은 레포에 넣지 않고 빌드할 때 한 번 내려받는다.
// 버전과 해시를 sonkkeut-native/build.gradle.kts와 같게 고정한다. latest를 받으면 검증 없이 APK에 들어가고,
// 같은 파일을 쓰는 sonkkeut-native 빌드가 해시 불일치로 실패할 수 있다.
def handModel = file("src/main/assets/sonkkeut/hand_landmarker.task")
def handModelSha256 = "fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1"
def sha256Of = { File f -> java.security.MessageDigest.getInstance("SHA-256").digest(f.bytes).encodeHex().toString() }
tasks.register("downloadHandModel") {
  outputs.file(handModel)
  doLast {
    if (!handModel.exists()) {
      def url = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      println "손 관절 모델 내려받는 중: $url"
      handModel.parentFile.mkdirs()
      // 임시 파일로 받아 검증한 뒤에만 옮겨, 받다가 끊겨도 깨진 파일이 남지 않게 한다
      def temporary = new File(handModel.parentFile, "hand_landmarker.download")
      try {
        new URL(url).withInputStream { i -> temporary.withOutputStream { it << i } }
        if (sha256Of(temporary) != handModelSha256) throw new GradleException("손끝 모델 파일의 검증값이 일치하지 않습니다.")
        java.nio.file.Files.move(temporary.toPath(), handModel.toPath())
      } finally {
        temporary.delete()
      }
    }
    if (sha256Of(handModel) != handModelSha256) {
      throw new GradleException("손끝 모델이 고정 버전과 다릅니다. 파일을 지우고 다시 빌드하세요: $handModel")
    }
  }
}
preBuild.dependsOn("downloadHandModel")
